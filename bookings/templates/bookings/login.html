<!-- bookings/templates/bookings/login.html -->
{% extends 'bookings/base.html' %}
{% block content %}

<style>
  .login-box {
    margin-top: 40px;
  }
  .login-title {
    font-weight: 700;
    letter-spacing: 1px;
  }
  .login-card {
    border-radius: 10px;
  }
  .login-bg {
    background: url('https://images.pexels.com/photos/4870708/pexels-photo-4870708.jpeg') no-repeat center/cover;
    min-height: 100vh;
  }
</style>

<div class="login-bg d-flex justify-content-center align-items-center">
  <div class="col-md-4 login-box">
    <div class="card login-card shadow-lg p-4">
      <h3 class="text-center login-title mb-3">Login</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
      </form>

      <p class="text-center mt-3">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-decoration-none">Register</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}

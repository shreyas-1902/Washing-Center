<!-- bookings/templates/bookings/register.html -->
{% extends 'bookings/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 shadow-sm">
      <h4>Create account</h4>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-info w-100 text-white">Register</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
